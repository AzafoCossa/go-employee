<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Employee</a>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Início</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="card mx-auto mt-5">
        <div class="card-header">Listagem de funcionários</div>
        <div class="card-body">
          <div class="mb-3">
            <button
              type="button"
              class="btn btn-warning"
              data-bs-toggle="modal"
              data-bs-target="#addModal"
            >
              Adicionar funcionário
            </button>
          </div>
          <table class="table table-striped">
            {{if .}}
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Primeiro nome</th>
                  <th scope="col">Último nome</th>
                  <th scope="col">Salario</th>
                  <th scope="col">Departamento</th>
                  <th scope="col" style="width:250px">Ações</th>
                </tr>
              </thead>
              <tbody>
                {{range .}}
                <tr>
                  <th scope="row">{{.Id}}</th>
                  <td>{{.FirstName}}</td>
                  <td>{{.LastName}}</td>
                  <td>{{.Salary}}</td>
                  <td>{{.Department}}</td>
                  <td>
                    <div
                      class="btn-group btn-group-sm"
                      role="group"
                      aria-label="Action buttons"
                    >
                      <button type="button" class="btn btn-secondary">
                        Visualizar
                      </button>
                      <button
                        type="button"
                        class="btn btn-warning"
                        data-bs-toggle="modal"
                        data-bs-target="#editModal"
                      >
                        Editar
                      </button>
                      <button type="button" class="btn btn-danger">
                        Remover
                      </button>
                    </div>
                  </td>
                </tr>
                {{end}}
              </tbody>
            {{else}}
              <p class="text-center text-danger">Sem dados por mostrar</p>
            {{end}}
          </table>
        </div>
      </div>
    </div>

    <!-- Add Modal -->
    <div
      class="modal fade"
      id="addModal"
      tabindex="-1"
      aria-labelledby="addModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="addModalLabel">
              Adicionar funcionário
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form action="/employees/insert">
            <div class="modal-body mx-2">
              <div class="row">
                <input type="text" name="firstName" class="form-control" placeholder="Digite o primeiro nome">
              </div>

              <div class="row mt-4">
                <input type="text" name="lastName" class="form-control" placeholder="Digite o ultimo nome">
              </div>

              <div class="row mt-4">
                <input type="text" name="salary" class="form-control" placeholder="Digite o salario">
              </div>

              <div class="row mt-4">
                <input type="text" name="department" class="form-control" placeholder="Digite o departamento">
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Add Modal -->

    <!-- Edit Modal -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="editModalLabel">
              Editar funcionário
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">...</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary">Save changes</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Edit Modal -->
    <script src="/static/bootstrap/js/bootstrap.min.js"></script>
  </body>
</html>
